version: "3.8"

services:
  app:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./DataBase:/app/DataBase
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
